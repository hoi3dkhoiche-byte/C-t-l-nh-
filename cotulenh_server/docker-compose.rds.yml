# =============================================================================
# DOCKER COMPOSE PRODUCTION — KẾT NỐI AWS RDS MYSQL (Không chạy MySQL nội bộ)
# Yêu cầu: Đã tạo file .env cấu hình DATABASE_URL (RDS) và JWT_SECRET_KEY thật.
# Chạy: docker compose -f docker-compose.rds.yml up --build -d
# =============================================================================
services:
  server:
    build: .
    restart: unless-stopped
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Bat buoc cau hinh DATABASE_URL tro toi AWS RDS MySQL trong file .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Bat buoc cau hinh JWT_SECRET_KEY bao mat (>=32 ky tu) trong file .env}
      DB_SSL_MODE: ${DB_SSL_MODE:-VERIFY_IDENTITY}
      DB_SSL_CA: ${DB_SSL_CA:-/etc/ssl/certs/aws-rds-global-bundle.pem}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/db-health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
